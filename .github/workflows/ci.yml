name: Neon Hub CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCED_INTERNAL_NODE_VERSION: node24

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Server Checks: Express.js Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  server-ci:
    name: Server Tests & Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Server Unit & Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_at_least_64_characters_long_for_security_purposes_only
          JWT_EXPIRES_IN: 15m
          REFRESH_TOKEN_EXPIRES_IN: 7d

  # ─────────────────────────────────────────────────────────────────────────────
  # Client Checks: React 19 + Vite Frontend SPA
  # ─────────────────────────────────────────────────────────────────────────────
  client-ci:
    name: Client Tests & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Client Component & Page Tests
        run: npm test

      - name: Verify Client Production Bundle
        run: npm run build
